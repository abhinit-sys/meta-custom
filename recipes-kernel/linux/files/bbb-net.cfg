# Force generic PHY driver instead of SMSC
# SMSC probe fails with error -5 on BBB Rev D
# CONFIG_SMSC_PHY is not set
# BBB Rev D ethernet fix
# Disable SMSC PHY (probe fails, generic PHY works)
# CONFIG_SMSC_PHY is not set
# Disable switchdev CPSW (uses wrong DT PHY paths)
# CONFIG_TI_CPSW_SWITCHDEV is not set
# Enable legacy CPSW driver (works with Yocto DTB)
CONFIG_TI_CPSW=y
CONFIG_TI_CPSW_SWITCHDEV=y
